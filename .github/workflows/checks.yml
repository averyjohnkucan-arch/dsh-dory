name: checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --ignore-scripts --config.strictDepBuilds=false
      - run: pnpm run check
      - run: pnpm test
      - run: pnpm pack --out /tmp/plugin-ci.tgz
      - name: Publish plugin release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version')
          if ! gh release view "v$version" >/dev/null 2>&1; then
            gh release create "v$version" /tmp/plugin-ci.tgz --target "$GITHUB_SHA" --title "Dory $version" --notes 'Portable model configs, recursive shard import, editable names, native memory fitting and throughput measurements, persistent SSD conversation checkpoints, and a verified automatic runtime installer. See README and validation notes for supported hardware and test scope.'
          fi
